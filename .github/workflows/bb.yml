name: bb

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bb-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: 1.12.212
      - run: bb bb-compat
